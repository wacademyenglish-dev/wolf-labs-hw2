<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A city at night in the rain, with one light in the sky">
<!-- ══════════════════════════════════════════════════════════════════
     CAPA DA LIÇÃO DE CASA · It Can't Be Him · The Batman · B1
     Desenhada aqui, e não gerada: ela precisa existir HOJE, e um SVG
     autoral pesa 5 KB, é arquivo local (zero hotlink), e escala de um
     celular a um monitor sem perder um pixel.
     Ela não entrega nada da aula: é a cidade, a chuva e uma luz. O que
     o aluno vai concluir é o exercício — a capa não pode ser a resposta.
     ══════════════════════════════════════════════════════════════════ -->
<defs>
  <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#16090c"/>
    <stop offset=".46" stop-color="#2a1014"/>
    <stop offset=".78" stop-color="#120a0d"/>
    <stop offset="1" stop-color="#0b0809"/>
  </linearGradient>
  <radialGradient id="halo" cx=".68" cy=".26" r=".42">
    <stop offset="0" stop-color="#e2544d" stop-opacity=".55"/>
    <stop offset=".45" stop-color="#d8a13c" stop-opacity=".16"/>
    <stop offset="1" stop-color="#d8a13c" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="feixe" x1="0" y1="1" x2=".25" y2="0">
    <stop offset="0" stop-color="#f6e7b8" stop-opacity=".50"/>
    <stop offset=".55" stop-color="#e9c880" stop-opacity=".16"/>
    <stop offset="1" stop-color="#e9c880" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="perto" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0709"/><stop offset="1" stop-color="#050405"/>
  </linearGradient>
  <linearGradient id="meio" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#180e12"/><stop offset="1" stop-color="#0d080a"/>
  </linearGradient>
  <linearGradient id="longe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#251319"/><stop offset="1" stop-color="#160c10"/>
  </linearGradient>
  <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b0809" stop-opacity="0"/>
    <stop offset=".3" stop-color="#1a0d10" stop-opacity=".85"/>
    <stop offset="1" stop-color="#060405"/>
  </linearGradient>
  <!-- a chuva: dois passos de fios finos, inclinados, e nada anima -->
  <pattern id="chuva" width="46" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
    <line x1="6" y1="0" x2="6" y2="52" stroke="#efe6e3" stroke-opacity=".16" stroke-width="1.1"/>
    <line x1="27" y1="34" x2="27" y2="96" stroke="#efe6e3" stroke-opacity=".10" stroke-width="1"/>
    <line x1="39" y1="8" x2="39" y2="44" stroke="#efe6e3" stroke-opacity=".07" stroke-width=".9"/>
  </pattern>
  <pattern id="grao" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="3" fill="none"/>
    <rect width="1" height="1" fill="#efe6e3" fill-opacity=".05"/>
    <rect x="2" y="2" width="1" height="1" fill="#000" fill-opacity=".07"/>
  </pattern>
  <clipPath id="quadro"><rect width="1600" height="900"/></clipPath>
</defs>

<g clip-path="url(#quadro)">
  <rect width="1600" height="900" fill="url(#ceu)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <!-- o feixe: uma luz só, saindo da cidade e abrindo no céu -->
  <path d="M735 640 L1085 96 L1330 150 L805 660 Z" fill="url(#feixe)"/>
  <ellipse cx="1130" cy="150" rx="150" ry="86" fill="#f6e7b8" opacity=".07"/>

  <!-- ── camada distante ── -->
  <g fill="url(#longe)">
    <rect x="40" y="420" width="86" height="480"/><rect x="140" y="368" width="64" height="532"/>
    <rect x="222" y="446" width="104" height="454"/><rect x="344" y="392" width="72" height="508"/>
    <rect x="430" y="470" width="92" height="430"/><rect x="1178" y="404" width="80" height="496"/>
    <rect x="1272" y="454" width="110" height="446"/><rect x="1398" y="382" width="70" height="518"/>
    <rect x="1484" y="440" width="96" height="460"/>
  </g>
  <!-- janelas distantes: poucas, e nenhuma alinhada com a vizinha -->
  <g fill="#e7c98a" opacity=".30">
    <rect x="56" y="452" width="7" height="10"/><rect x="86" y="500" width="7" height="10"/>
    <rect x="154" y="404" width="7" height="10"/><rect x="178" y="470" width="7" height="10"/>
    <rect x="242" y="486" width="7" height="10"/><rect x="290" y="530" width="7" height="10"/>
    <rect x="360" y="428" width="7" height="10"/><rect x="386" y="496" width="7" height="10"/>
    <rect x="452" y="512" width="7" height="10"/><rect x="1196" y="440" width="7" height="10"/>
    <rect x="1228" y="508" width="7" height="10"/><rect x="1294" y="494" width="7" height="10"/>
    <rect x="1340" y="556" width="7" height="10"/><rect x="1414" y="418" width="7" height="10"/>
    <rect x="1506" y="478" width="7" height="10"/><rect x="1544" y="540" width="7" height="10"/>
  </g>

  <!-- ── camada média ── -->
  <g fill="url(#meio)">
    <rect x="0" y="520" width="130" height="380"/><rect x="150" y="486" width="118" height="414"/>
    <rect x="290" y="556" width="150" height="344"/><rect x="462" y="500" width="126" height="400"/>
    <rect x="610" y="580" width="140" height="320"/>
    <rect x="1040" y="524" width="134" height="376"/><rect x="1196" y="566" width="120" height="334"/>
    <rect x="1336" y="510" width="146" height="390"/><rect x="1502" y="576" width="98" height="324"/>
  </g>
  <g fill="#e7c98a" opacity=".42">
    <rect x="22" y="556" width="9" height="13"/><rect x="58" y="612" width="9" height="13"/>
    <rect x="98" y="556" width="9" height="13"/><rect x="170" y="524" width="9" height="13"/>
    <rect x="206" y="592" width="9" height="13"/><rect x="242" y="524" width="9" height="13"/>
    <rect x="312" y="594" width="9" height="13"/><rect x="366" y="650" width="9" height="13"/>
    <rect x="412" y="594" width="9" height="13"/><rect x="484" y="540" width="9" height="13"/>
    <rect x="536" y="610" width="9" height="13"/><rect x="634" y="620" width="9" height="13"/>
    <rect x="700" y="676" width="9" height="13"/>
    <rect x="1062" y="562" width="9" height="13"/><rect x="1118" y="628" width="9" height="13"/>
    <rect x="1220" y="604" width="9" height="13"/><rect x="1276" y="670" width="9" height="13"/>
    <rect x="1358" y="548" width="9" height="13"/><rect x="1430" y="616" width="9" height="13"/>
    <rect x="1524" y="614" width="9" height="13"/>
  </g>
  <!-- o prédio de onde a luz sai: uma torre e a lanterna acesa -->
  <rect x="742" y="392" width="86" height="508" fill="url(#meio)"/>
  <rect x="756" y="352" width="58" height="44" fill="#1c1014"/>
  <rect x="766" y="362" width="38" height="24" fill="#f6e7b8" opacity=".72"/>
  <rect x="780" y="300" width="10" height="54" fill="#1c1014"/>

  <!-- ── camada perto: os telhados, em silhueta cheia ── -->
  <g fill="url(#perto)">
    <rect x="-20" y="668" width="220" height="252"/><rect x="196" y="716" width="182" height="204"/>
    <rect x="374" y="662" width="164" height="258"/><rect x="534" y="730" width="210" height="190"/>
    <rect x="860" y="700" width="196" height="220"/><rect x="1052" y="658" width="170" height="262"/>
    <rect x="1218" y="726" width="204" height="194"/><rect x="1418" y="684" width="220" height="236"/>
  </g>
  <!-- caixas d'água e antenas: a silhueta só é cidade quando tem coisa em cima -->
  <g fill="#050405">
    <rect x="60" y="638" width="44" height="32"/><rect x="74" y="606" width="4" height="34"/>
    <rect x="410" y="628" width="52" height="36"/><rect x="432" y="592" width="4" height="38"/>
    <rect x="1090" y="624" width="46" height="36"/><rect x="1110" y="586" width="4" height="40"/>
    <rect x="1470" y="650" width="56" height="36"/><rect x="1500" y="612" width="4" height="40"/>
    <path d="M236 716 l26 -34 26 34 z"/><path d="M1268 726 l30 -38 30 38 z"/>
  </g>

  <!-- a rua molhada: o reflexo é o que diz que choveu -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#chao)"/>
  <g opacity=".20">
    <rect x="772" y="700" width="26" height="200" fill="#f6e7b8"/>
    <rect x="742" y="740" width="10" height="160" fill="#e2544d"/>
    <rect x="828" y="762" width="8" height="138" fill="#d8a13c"/>
  </g>

  <rect width="1600" height="900" fill="url(#chuva)"/>
  <rect width="1600" height="900" fill="url(#grao)"/>
  <!-- vinheta curta: a moldura da projeção, e não uma vinheta de 90% -->
  <rect width="1600" height="900" fill="none" stroke="#000" stroke-width="90" opacity=".30"/>
</g>
</svg>
