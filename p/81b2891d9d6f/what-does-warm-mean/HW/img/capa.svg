<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A video store at night, seen from the street">
<!-- ══════════════════════════════════════════════════════════════════
     CAPA DA LIÇÃO DE CASA · What Does Warm Mean? · The Office · B2
     A vitrine da locadora vista da calçada, às onze da noite. Desenhada
     aqui e não gerada: precisa existir hoje, pesa 6 KB, é arquivo local
     e escala de um celular a um monitor sem perder um pixel.
     Ela não entrega nada da aula — é só a loja aberta.
     ══════════════════════════════════════════════════════════════════ -->
<defs>
  <linearGradient id="noite" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0713"/>
    <stop offset=".55" stop-color="#140b22"/>
    <stop offset="1" stop-color="#080610"/>
  </linearGradient>
  <radialGradient id="rosa" cx=".26" cy=".28" r=".46">
    <stop offset="0" stop-color="#ff5fb4" stop-opacity=".46"/>
    <stop offset=".5" stop-color="#ff5fb4" stop-opacity=".12"/>
    <stop offset="1" stop-color="#ff5fb4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="teal" cx=".82" cy=".62" r=".38">
    <stop offset="0" stop-color="#4fd8d2" stop-opacity=".34"/>
    <stop offset="1" stop-color="#4fd8d2" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="vitr" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a1b3a"/><stop offset="1" stop-color="#160e22"/>
  </linearGradient>
  <linearGradient id="mad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6a4629"/><stop offset=".5" stop-color="#3a2415"/><stop offset="1" stop-color="#241609"/>
  </linearGradient>
  <linearGradient id="calc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b1226" stop-opacity=".9"/><stop offset="1" stop-color="#070510"/>
  </linearGradient>
  <pattern id="carpete" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="8" r="2.2" fill="#ff5fb4" fill-opacity=".10"/>
    <circle cx="22" cy="22" r="2.2" fill="#4fd8d2" fill-opacity=".09"/>
  </pattern>
  <pattern id="grao" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="1" height="1" fill="#f3ecdf" fill-opacity=".05"/>
    <rect x="2" y="2" width="1" height="1" fill="#000" fill-opacity=".07"/>
  </pattern>
  <clipPath id="q"><rect width="1600" height="900"/></clipPath>
</defs>

<g clip-path="url(#q)">
  <rect width="1600" height="900" fill="url(#noite)"/>

  <!-- a vitrine: o retângulo de luz que a loja joga na rua -->
  <rect x="120" y="120" width="1360" height="600" fill="url(#vitr)"/>
  <rect x="120" y="120" width="1360" height="600" fill="url(#carpete)"/>

  <!-- as prateleiras do fundo, com as lombadas -->
  <g>
    <rect x="176" y="300" width="560" height="14" fill="url(#mad)"/>
    <rect x="176" y="470" width="560" height="14" fill="url(#mad)"/>
    <rect x="880" y="300" width="540" height="14" fill="url(#mad)"/>
    <rect x="880" y="470" width="540" height="14" fill="url(#mad)"/>
  </g>
  <g>
    <!-- lombadas: larguras e tons variados, e nenhuma legível -->
    <g fill="#221a2e">
      <rect x="182" y="196" width="22" height="104"/><rect x="208" y="188" width="16" height="112"/>
      <rect x="228" y="200" width="24" height="100"/><rect x="256" y="192" width="18" height="108"/>
      <rect x="278" y="198" width="26" height="102"/><rect x="308" y="190" width="20" height="110"/>
      <rect x="332" y="202" width="16" height="98"/><rect x="352" y="194" width="24" height="106"/>
      <rect x="380" y="188" width="18" height="112"/><rect x="402" y="200" width="22" height="100"/>
      <rect x="428" y="192" width="26" height="108"/><rect x="458" y="198" width="16" height="102"/>
      <rect x="478" y="190" width="24" height="110"/><rect x="506" y="202" width="20" height="98"/>
      <rect x="530" y="194" width="18" height="106"/><rect x="552" y="188" width="26" height="112"/>
      <rect x="582" y="200" width="22" height="100"/><rect x="608" y="196" width="16" height="104"/>
      <rect x="628" y="192" width="24" height="108"/><rect x="656" y="198" width="20" height="102"/>
      <rect x="680" y="190" width="26" height="110"/><rect x="710" y="200" width="18" height="100"/>
      <rect x="886" y="196" width="20" height="104"/><rect x="910" y="190" width="26" height="110"/>
      <rect x="940" y="200" width="16" height="100"/><rect x="960" y="194" width="24" height="106"/>
      <rect x="988" y="188" width="18" height="112"/><rect x="1010" y="198" width="22" height="102"/>
      <rect x="1036" y="192" width="26" height="108"/><rect x="1066" y="202" width="16" height="98"/>
      <rect x="1086" y="196" width="24" height="104"/><rect x="1114" y="190" width="20" height="110"/>
      <rect x="1138" y="200" width="18" height="100"/><rect x="1160" y="194" width="26" height="106"/>
      <rect x="1190" y="188" width="22" height="112"/><rect x="1216" y="198" width="16" height="102"/>
      <rect x="1236" y="192" width="24" height="108"/><rect x="1264" y="202" width="20" height="98"/>
      <rect x="1288" y="196" width="26" height="104"/><rect x="1318" y="190" width="18" height="110"/>
      <rect x="1340" y="200" width="22" height="100"/><rect x="1366" y="194" width="24" height="106"/>
    </g>
    <!-- a segunda fileira, mais escura -->
    <g fill="#1b1426">
      <rect x="182" y="366" width="24" height="104"/><rect x="210" y="372" width="18" height="98"/>
      <rect x="232" y="362" width="22" height="108"/><rect x="258" y="370" width="26" height="100"/>
      <rect x="288" y="366" width="16" height="104"/><rect x="308" y="360" width="24" height="110"/>
      <rect x="336" y="372" width="20" height="98"/><rect x="360" y="364" width="18" height="106"/>
      <rect x="382" y="368" width="26" height="102"/><rect x="412" y="360" width="22" height="110"/>
      <rect x="438" y="370" width="16" height="100"/><rect x="458" y="366" width="24" height="104"/>
      <rect x="486" y="362" width="20" height="108"/><rect x="510" y="372" width="26" height="98"/>
      <rect x="540" y="364" width="18" height="106"/><rect x="562" y="368" width="22" height="102"/>
      <rect x="588" y="360" width="24" height="110"/><rect x="616" y="370" width="16" height="100"/>
      <rect x="636" y="366" width="26" height="104"/><rect x="666" y="362" width="20" height="108"/>
      <rect x="690" y="372" width="22" height="98"/>
      <rect x="886" y="366" width="18" height="104"/><rect x="908" y="360" width="26" height="110"/>
      <rect x="938" y="370" width="22" height="100"/><rect x="964" y="364" width="16" height="106"/>
      <rect x="984" y="368" width="24" height="102"/><rect x="1012" y="362" width="20" height="108"/>
      <rect x="1036" y="372" width="26" height="98"/><rect x="1066" y="366" width="18" height="104"/>
      <rect x="1088" y="360" width="22" height="110"/><rect x="1114" y="370" width="24" height="100"/>
      <rect x="1142" y="364" width="16" height="106"/><rect x="1162" y="368" width="26" height="102"/>
      <rect x="1192" y="362" width="20" height="108"/><rect x="1216" y="372" width="22" height="98"/>
      <rect x="1242" y="366" width="18" height="104"/><rect x="1264" y="360" width="26" height="110"/>
      <rect x="1294" y="370" width="24" height="100"/><rect x="1322" y="364" width="16" height="106"/>
      <rect x="1342" y="368" width="22" height="102"/>
    </g>
  </g>

  <!-- o balcão, embaixo, com o abajur -->
  <rect x="176" y="560" width="1244" height="120" fill="#1d1428"/>
  <rect x="176" y="560" width="1244" height="12" fill="url(#mad)"/>
  <ellipse cx="1240" cy="560" rx="140" ry="34" fill="#ffd6a0" opacity=".10"/>
  <rect x="1222" y="506" width="36" height="54" fill="#120d1c"/>
  <path d="M1196 506 h88 l-16 -32 h-56 z" fill="#2a1b3a"/>
  <ellipse cx="1240" cy="506" rx="44" ry="8" fill="#ffd6a0" opacity=".24"/>

  <!-- a luz que sai da vitrine e cai na calçada -->
  <rect width="1600" height="900" fill="url(#rosa)"/>
  <rect width="1600" height="900" fill="url(#teal)"/>

  <!-- o letreiro de néon: só as formas, nenhuma palavra legível -->
  <g opacity=".92">
    <rect x="300" y="80" width="420" height="8" rx="4" fill="#ffd6ec"/>
    <rect x="300" y="80" width="420" height="8" rx="4" fill="#ff5fb4" opacity=".7"/>
    <rect x="300" y="104" width="250" height="6" rx="3" fill="#9ff5f0"/>
    <circle cx="1330" cy="96" r="30" fill="none" stroke="#4fd8d2" stroke-width="5"/>
    <circle cx="1330" cy="96" r="30" fill="none" stroke="#9ff5f0" stroke-width="1.6"/>
  </g>

  <!-- a moldura da vitrine, por cima de tudo -->
  <rect x="120" y="120" width="1360" height="600" fill="none" stroke="#0a0713" stroke-width="26"/>
  <rect x="120" y="120" width="1360" height="600" fill="none" stroke="#3a2b52" stroke-width="4"/>
  <rect x="792" y="120" width="16" height="600" fill="#0a0713"/>

  <!-- a calçada molhada e o reflexo -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#calc)"/>
  <g opacity=".16">
    <rect x="300" y="720" width="420" height="150" fill="#ff5fb4"/>
    <rect x="1300" y="720" width="62" height="150" fill="#4fd8d2"/>
  </g>
  <rect width="1600" height="900" fill="url(#grao)"/>
  <rect width="1600" height="900" fill="none" stroke="#000" stroke-width="80" opacity=".3"/>
</g>
</svg>
