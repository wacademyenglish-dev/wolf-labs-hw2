<!-- ================================================================
     LIÇÃO DE CASA v2 — O MOTOR NOVO                    (22/09/2026)

     Pedido do Carlos: "refazer todas com mecânicas diferentes, porque
     elas sempre começam com o negócio de escrever... seguir um pouco
     da estética da plataforma". Nasce ao lado do motor de seis páginas
     (CHASSI-FONTE/base/hw-shell.html), sem substituí-lo.

     O QUE É NOVO
     · mecânicas: ditado (ouve e escreve), ordem (monta a frase tocando
       as palavras) e pares (liga uma coisa à outra), além das antigas
       ouvir / lacuna / hist / achar / escrever / seu;
     · a cara da plataforma: lavanda de dia, névoa de noite (o aluno
       troca no botão; o navegador escolhe na primeira vez);
     · o áudio vem da própria aula (AUDIO_BASE), sem gravar nada novo.

     O QUE NÃO MUDOU, DE PROPÓSITO
     · o recado para a plataforma (`avisaQuemAbriu`) é o MESMO do motor
       antigo, palavra por palavra: `wolf:'hw-resultado'`, placar de
       PRIMEIRA tentativa, destino exato de `?wl`. Os itens novos entram
       na conta pelas classes .dit / .ord / .par, com o mesmo
       `data-errou` de sempre.
     · a chave do localStorage continua `wolf-hw-<id>`: o professor vê a
       mesma lição, e o aluno que já tinha começado recomeça limpo
       (o estado antigo não bate com as páginas novas — `S.v`).
     ================================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e0f3; --card:#efecf8; --card2:#f6f4fc; --borda:rgba(40,26,96,.12); --borda2:rgba(40,26,96,.22);
  --t1:#1c1733; --t2:#3b3656; --t3:#55506e; --ac:#5b3fd6; --ac2:#7b5cf0; --pil:#ddd5f7; --tinta:#fff;
  --ok:#1d6440; --okbg:rgba(29,100,64,.12); --no:#9a3226; --nobg:rgba(154,50,38,.10);
  --indigo:linear-gradient(160deg,#3d2b93,#1f1147);
  --fundo:radial-gradient(900px 620px at 0% 0%,#e2dbfa,transparent 62%),radial-gradient(800px 600px at 100% 100%,#ecd8ea,transparent 62%),linear-gradient(135deg,#d9d3f0,#dcdcf1);
  --sombra:0 1px 2px rgba(40,26,110,.05),0 10px 26px rgba(40,26,110,.08);
  color-scheme:light;
}
:root[data-tema="escuro"]{
  --bg:#131218; --card:#201e28; --card2:#262430; --borda:rgba(233,230,239,.10); --borda2:rgba(233,230,239,.2);
  --t1:#ece9f4; --t2:#cfcbd8; --t3:#a7a1b8; --ac:#9b7bff; --ac2:#b39cff; --pil:rgba(155,123,255,.16); --tinta:#12091f;
  --ok:#8ad3a2; --okbg:rgba(138,211,162,.14); --no:#f2a097; --nobg:rgba(242,160,151,.14);
  --fundo:radial-gradient(760px 560px at 0% 0%,#3b3270,transparent 64%),linear-gradient(175deg,#2b2640 0%,#17151f 60%,#131218 100%);
  --sombra:0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--fundo);background-attachment:fixed;color:var(--t1);font:16px/1.5 Manrope,system-ui,sans-serif;font-synthesis-weight:none}
button{font:inherit;color:inherit}
.w{max-width:860px;margin:0 auto;padding:0 18px}

/* o cabeçalho: o cartão índigo da casa */
.topo{padding-top:18px;padding-bottom:8px}
.capa{position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;padding:20px 22px;border-radius:28px;color:#fff;
  background:radial-gradient(closest-side,transparent 96%,rgba(255,255,255,.1) 97%,transparent 100%) 70% 170%/140% 120% no-repeat,
             radial-gradient(360px 220px at 95% 0%,rgba(196,181,253,.32),transparent 70%),var(--indigo);
  box-shadow:0 18px 40px rgba(31,17,71,.25)}
.capa img{flex:none;width:74px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 10px 22px rgba(0,0,0,.4);transform:rotate(-3deg)}
.capa-txt{min-width:0;flex:1}
.capa small{display:block;color:#d9d0ff;font-weight:700;font-size:13px}
.capa h1{margin:2px 0 4px;font:400 clamp(26px,4.4vw,36px)/1.08 Gloock,serif}
.capa p{margin:0;color:#e8e3ff;font-size:14px}
.tema-bt{flex:none;align-self:flex-start;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:16px}
.trilha{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.pss{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--borda);background:var(--card);cursor:pointer;font-size:13px;font-weight:700;color:var(--t3)}
.pss k{font:400 14px Gloock,serif}
.pss.on{background:var(--ac);border-color:var(--ac);color:var(--tinta)}
.pss.fez:not(.on){color:var(--ok);border-color:var(--ok)}
.barra{height:8px;border-radius:4px;background:var(--pil);overflow:hidden;margin:14px 0 4px}
.barra i{display:block;height:100%;width:0;background:var(--ac);border-radius:3px;transition:width .4s}
#pfeito{font-size:12.5px;color:var(--t3);font-weight:700}

/* a página */
html{scroll-padding-bottom:150px}main.w .dica-dit{margin:0 0 10px;color:var(--t2,#5b5670);font-size:15px;font-weight:600}main.w{padding-top:10px;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.pag{background:var(--card);border:1px solid var(--borda);border-radius:26px;padding:22px;box-shadow:var(--sombra)}
.ph{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.pnum{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pil);color:var(--ac);font:400 20px Gloock,serif}
.ph h2{margin:0;font:400 26px/1.1 Gloock,serif}
.ph p{margin:4px 0 0;color:var(--t2);font-size:15px}
.como{margin:12px 0 18px;padding:12px 14px;border-radius:16px;background:var(--card2);border:1px dashed var(--borda2);color:var(--t2);font-size:14.5px}
.como b{color:var(--t1)}

/* os botões e as fichas */
.chip{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--borda2);background:var(--card2);cursor:pointer;font-weight:700;font-size:15px;color:var(--t1);transition:transform .12s}
.chip:hover{border-color:var(--ac)}
.chip.sel{background:var(--ac);border-color:var(--ac);color:var(--tinta)}
.chip.usado{opacity:.35;pointer-events:none}
.chip:active{transform:scale(.97)}
.btn{min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--ac);color:var(--tinta);font-weight:800;cursor:pointer}
.btn.gh{background:transparent;border:1.5px solid var(--borda2);color:var(--t1)}
.btn:disabled{opacity:.45;cursor:default}
.mal{animation:treme .32s}
@keyframes treme{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.mal{animation:none}.barra i{transition:none}}
.porque{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--okbg);color:var(--t1);font-size:14px}
.porque.no{background:var(--nobg)}

/* play */
.play{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--indigo);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px rgba(31,17,71,.25)}
.play svg{width:22px;height:22px;fill:#fff}
.play.toca{outline:3px solid var(--ac2);outline-offset:2px}
.play.toca svg path{d:path("M7 5h4v14H7zM13 5h4v14h-4z")}
.devagar.toca{outline:2px solid var(--ac2);outline-offset:1px}
.devagar{border:0;background:none;color:var(--ac);font-weight:800;font-size:13px;cursor:pointer;padding:6px}

/* ouvir */
.clipe{padding:14px;border-radius:20px;background:var(--card2);border:1px solid var(--borda);margin-bottom:12px}
.clipe .ch{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.clipe .q{margin:0;font-weight:700;color:var(--t2)}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abb{display:flex;gap:10px;align-items:center;text-align:left;min-height:52px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--borda2);background:var(--card);cursor:pointer;font-size:15px}
.abb i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pil);color:var(--ac);font-weight:800}
.abb.certo{border-color:var(--ok);background:var(--okbg)}
.abb.errado{border-color:var(--no);background:var(--nobg)}

/* pares */
.pares{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.pares .col{display:grid;gap:10px;align-content:start}
.pp{min-height:52px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--borda2);background:var(--card2);cursor:pointer;text-align:left;font-size:15px;font-weight:600}
.pp.sel{border-color:var(--ac);background:var(--pil)}
.pp.feito{pointer-events:none;border-style:solid}
.pp.feito[data-cor]{color:var(--t1)}

/* ordem */
.ord{padding:14px;border-radius:20px;background:var(--card2);border:1px solid var(--borda);margin-bottom:12px}
.ord .dica{margin:0 0 10px;color:var(--t3);font-size:14px}
.linha-ord{min-height:54px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:16px;border:1.5px dashed var(--borda2);margin-bottom:10px;background:var(--card)}
.linha-ord:empty::before{content:attr(data-vazio);color:var(--t3);font-size:14px;padding:0 6px}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ord.certo .linha-ord{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.ord .acoes{display:flex;gap:8px;margin-top:10px}

/* lacuna e história */
.banco{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:18px;background:var(--card2);border:1px solid var(--borda);margin-bottom:14px;position:sticky;top:8px;z-index:2}
.linhas{display:grid;gap:8px}
.lin{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:14px;background:var(--card2)}
.lin k{font:400 16px Gloock,serif;color:var(--t3);min-width:26px}
.lin p,.hist p{margin:0;font-size:16px;line-height:2}
.gap{display:inline-block;min-width:78px;min-height:34px;margin:0 3px;padding:0 10px;border:0;border-bottom:2px solid var(--ac);border-radius:8px 8px 0 0;background:var(--pil);cursor:pointer;font-weight:800;color:var(--ac);vertical-align:baseline}
.gap.cheio{background:var(--okbg);color:var(--ok);border-color:var(--ok);pointer-events:none}
.hist{padding:14px 16px;border-radius:18px;background:var(--card2)}

/* ditado e escrever */
.dit,.esc{padding:14px;border-radius:20px;background:var(--card2);border:1px solid var(--borda);margin-bottom:12px}
.dit .ch{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.campo{display:flex;gap:8px}
.campo input{flex:1;min-width:0;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--borda2);background:var(--card);color:var(--t1);font:600 16px Manrope,sans-serif}
.campo input:focus{outline:2px solid var(--ac);outline-offset:1px}
.dit.certo input,.esc.certo input{border-color:var(--ok);background:var(--okbg)}
.esc .longa{margin:0 0 10px;font-size:16px}

/* achar */
.erro{padding:14px;border-radius:20px;background:var(--card2);border:1px solid var(--borda);margin-bottom:12px}
.erro .frase{margin:0 0 8px;font:400 22px Gloock,serif}
.erro .pergunta{margin:6px 0;color:var(--t3);font-weight:700;font-size:13.5px}
.opcoes{display:grid;gap:6px}
.op{min-height:46px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--borda2);background:var(--card);text-align:left;cursor:pointer;font-size:15px}
.op.certo{border-color:var(--ok);background:var(--okbg)}
.op.errado{border-color:var(--no);background:var(--nobg)}

/* seu */
.seu{padding:14px;border-radius:20px;background:var(--card2);margin-bottom:12px}
.seu p{margin:0 0 8px;font-weight:700}
.seu textarea{width:100%;min-height:84px;padding:12px;border-radius:14px;border:1.5px solid var(--borda2);background:var(--card);color:var(--t1);font:16px/1.5 Manrope,sans-serif;resize:vertical}
.seu small{color:var(--t3)}

/* o rodapé */
.rod{position:fixed;left:0;right:0;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 60%,transparent)}
.rod .w{display:flex;align-items:center;gap:10px}
.rod .pagn{margin-left:auto;margin-right:auto;font-weight:700;color:var(--t3);font-size:14px}

/* o resultado */
.res{text-align:center;padding:10px 0}
.anel{width:150px;height:150px;margin:6px auto 4px}
.res h2{margin:0;font:400 30px Gloock,serif}
.res .sub{color:var(--t2);margin:4px 0 16px}
.grade{display:grid;gap:8px;text-align:left;margin:0 0 18px}
.gl{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;font-size:14px}
.gl .tr{height:8px;border-radius:4px;background:var(--pil);overflow:hidden}
.gl .tr i{display:block;height:100%;background:var(--ac)}
.rever{text-align:left;padding:14px;border-radius:18px;background:var(--card2);margin-top:12px}
.rever h3{margin:0 0 8px;font:400 20px Gloock,serif}
.rv{padding:8px 0;border-top:1px solid var(--borda);font-size:15px}
.rv b{display:block;color:var(--ok)}
.fecho{font-size:15px;color:var(--t2)}
/* a resposta mostrada depois de três erros: fecha o item, sem festa */
.rev,.gap.rev{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--t1)!important}
.revela{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--nobg);font-size:14px}
.revela b{color:var(--t1)}
.tentativas{font-size:12.5px;color:var(--t3);font-weight:700;margin-left:auto}
/* o resultado */
.res-topo{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;text-align:left;padding:20px;border-radius:24px;color:#fff;background:radial-gradient(360px 220px at 95% 0%,rgba(196,181,253,.32),transparent 70%),var(--indigo);margin-bottom:14px}
.res-topo .anel{margin:0}
.res-topo h2{color:#fff}
.res-topo .sub{color:#e6e0ff;margin:4px 0 0}
.widgets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
.wd{padding:14px;border-radius:20px;background:var(--card2);border:1px solid var(--borda);text-align:left}
.wd b{display:block;font:400 28px/1.1 Gloock,serif;color:var(--t1)}
.wd span{font-size:13px;color:var(--t3);font-weight:700}
.rv{display:flex;gap:12px;align-items:center}
.rv .rvt{flex:1;min-width:0}
.rv .rvt b{display:block;color:var(--ok)}
.addc{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ac);background:none;color:var(--ac);font-weight:800;font-size:13px;cursor:pointer}
.addc.ok{border-color:var(--ok);color:var(--ok);pointer-events:none}
.addc.no{border-color:var(--no);color:var(--no)}
.rever-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rever-cab h3{flex:1}
.festa{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.festa i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:cai 1.8s ease-in forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.festa{display:none}}
@media (max-width:640px){.widgets{grid-template-columns:repeat(2,minmax(0,1fr))}.res-topo{grid-template-columns:1fr;text-align:center}.res-topo .anel{margin:0 auto}}
@media (max-width:560px){.ab{grid-template-columns:1fr}.pares{gap:8px 10px}.pp{font-size:14px;padding:10px}.capa img{width:56px}}
/* ══ A CAMADA PREMIUM (Carlos, 22/09/2026: "tem que parecer um app premium;
   o aluno vê e pensa: nossa, isso é premium"; e sempre mobile friendly) ══ */
.barra{display:none}
.appbar{position:sticky;top:0;z-index:5;padding:10px 0 8px;margin-bottom:4px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--borda)}
.segs{display:flex;gap:4px;height:6px}
.sg{flex:1;border-radius:3px;background:color-mix(in srgb,var(--ac) 20%,transparent);transition:background .3s}
.sg.fez{background:var(--ac)}
.sg.on{background:var(--ac2);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac2) 30%,transparent)}
.sg.on.fez{background:var(--ac)}
#pfeito{display:flex;gap:8px;align-items:baseline;margin-top:8px;font-size:13px;color:var(--t3);font-weight:600}
#pfeito b{color:var(--t1);font-weight:800}
.feito span{margin-left:auto;padding:2px 10px;border-radius:999px;background:var(--pil);color:var(--ac);font-weight:800;font-size:12px}
.pag{position:relative;box-shadow:var(--sombra),inset 0 1px 0 rgba(255,255,255,.55)}
:root[data-tema="escuro"] .pag{box-shadow:var(--sombra),inset 0 1px 0 rgba(255,255,255,.05)}
.pnum{background:linear-gradient(145deg,var(--pil),transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ac) 35%,transparent)}
.clipe,.ord,.dit,.esc,.erro,.seu{transition:border-color .2s,box-shadow .2s}
.chip.sel,.pp.sel{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}
.campo input:focus,.seu textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
.gap.cheio,.abb.certo,.op.certo,.pp.feito,.dit.certo,.esc.certo,.ord.certo{animation:acerta .36s ease-out}
@keyframes acerta{40%{transform:scale(1.035)}}
.dit.certo,.esc.certo,.ord.certo,.clipe.feito,.erro.feito{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
#main.entra{animation:entra .34s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
/* o rodapé de app: vidro, voltar redondo, seguir largo */
.rod{background:none;padding:10px 0 calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.rod .w{pointer-events:auto;max-width:620px;padding:8px;border-radius:999px;border:1px solid var(--borda);
  background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  box-shadow:0 12px 34px rgba(20,12,60,.22);margin:0 auto;width:calc(100% - 28px)}
.volta{flex:none;width:48px;min-height:48px;padding:0;display:grid;place-items:center;border-radius:50%}
.volta svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.segue{flex:1;min-height:48px;font-size:16px;letter-spacing:.01em;transition:box-shadow .3s,transform .15s}
.segue.pronto{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent),0 10px 24px color-mix(in srgb,var(--ac) 35%,transparent)}
.segue:active,.volta:active{transform:scale(.97)}
.rod .pagn{flex:none;margin:0 6px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:8;display:flex;gap:12px;align-items:center;
  padding:10px 18px 10px 10px;border-radius:999px;background:var(--indigo);color:#fff;box-shadow:0 14px 34px rgba(20,12,60,.35);
  transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s;white-space:nowrap}
.toast.ve{transform:translate(-50%,0);opacity:1}
.toast i{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:rgba(255,255,255,.16)}
.toast.top i{background:#fff;color:#1d6440}

     (uma função que recebe a frase e devolve os trechos errados com a
     dica). Sublinha em vermelho ondulado e mostra a dica embaixo, SEM
     corrigir pelo aluno. Roda no aparelho: sem internet, sem custo.

     WolfCorretor.regras = function (frase, minusc) { return [ {i, f, msg} ] };

window.WolfCorretor = (function () {
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function frases(txt) {
    var out = [], re = /[^.!?\n]+[.!?]*/g, m;
    while ((m = re.exec(txt))) out.push({ ini: m.index, s: m[0] });

  }
  function confere(txt) {
    var achados = [];
    if (!api.regras) return achados;
    frases(txt).forEach(function (fr) {
      var minusc = fr.s.toLowerCase().replace(/[’‘]/g, "'");

  return api;
})();

  /* ordem */
  var ch=t.closest('.ord .chip'); if(ch){ var o=ch.closest('.ord'); if(o.classList.contains('certo')) return;

  /* ditado e escrever */
  var dt=t.closest('[data-dit],[data-esc]'); if(dt){ var box=dt.closest('.dit,.esc'); if(box.classList.contains('certo')) return;
    var inp=box.querySelector('input'), r=box.getAttribute('data-r'), pq2=box.querySelector('.porque');

    if(bate(inp.value,r,box.getAttribute('data-alt'))){ box.classList.add('certo'); inp.readOnly=true; if(box.classList.contains('dit')){ pq2.hidden=false; pq2.className='porque'; pq2.textContent=r; } confereFim(); }
    else { marcaErro(box); var n=mais1(box);

    return; }

  /* achar o erro, em dois passos */
  var op=t.closest('.op'); if(op){ var er=op.closest('.erro'); if(er.classList.contains('feito')) return;
    var it=PAGS[S.p].itens[+er.getAttribute('data-j')];

        er.querySelectorAll('[data-passo="1"] .op').forEach(function(x){ x.disabled=true; }); }

          er.querySelector('.porque').hidden=false; er.querySelector('.passo2').hidden=false;

    } else {
      if(+op.getAttribute('data-f')===it.fa){ op.classList.add('certo'); er.classList.add('feito'); confereFim(); }
      else { op.classList.add('errado'); op.disabled=true; marcaErro(er); erra(op, it.f, texto(it.fix[it.fa]));

    }
    return; }

<!--@@SEQ 13/10/2026 · a sequência de acertos (inspirada no "in a row" dos apps de idioma, feita do nosso jeito).
  Pendura-se em confereFim (acerto) e marcaErro (erro) do motor da HW Live; não muda nenhum tipo de rodada.
  Conta só acerto de primeira (item sem data-errou). Aparece a partir de 2; marcos 5, 10, 15… brilham em lima;
  no erro some de leve e volta a zero. Atravessa as rodadas; o recorde da lição vai para S.seq (salvo com grava). -->
<style>
.seq{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-140%);z-index:80;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:rgba(18,12,32,.92);border:1.5px solid var(--ac,#9b7bff);color:#fff;font:800 15px/1 Manrope,system-ui,sans-serif;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);pointer-events:none;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .3s;opacity:0}
.seq.ve{transform:translate(-50%,0);opacity:1}
.seq svg{width:20px;height:20px;flex:none}
.seq b{font-size:18px;font-variant-numeric:tabular-nums}
.seq small{font:700 12px Manrope,system-ui,sans-serif;opacity:.85;margin-left:2px}
.seq.marco{border-color:#c6f36b;box-shadow:0 0 0 4px rgba(198,243,107,.18),0 0 34px rgba(198,243,107,.55)}
.seq.marco svg{color:#c6f36b}
.seq.pula{animation:seqpula .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes seqpula{0%{transform:translate(-50%,0) scale(1)}40%{transform:translate(-50%,0) scale(1.18)}100%{transform:translate(-50%,0) scale(1)}}
@media (prefers-reduced-motion:reduce){.seq{transition:opacity .2s}.seq.pula{animation:none}}
</style>
<div class="seq" id="seq" role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.2-1.6 4.6-1.6 7.4 0 1.3.9 2.3 2.1 2.3 1.6 0 2.4-1.4 2.2-3.2 2.4 1.7 3.8 4.3 3.8 7.1A6.5 6.5 0 0 1 12 22a6.5 6.5 0 0 1-6.5-6.4c0-4.6 3.9-6.6 6.5-13.6z"/></svg><b id="seqN">0</b><span id="seqT">in a row</span></div>
<script>
(function(){
  if(typeof confereFim!=='function'||typeof marcaErro!=='function') return;
  var c=0, contados=[], el=document.getElementById('seq'), n=document.getElementById('seqN'), t=document.getElementById('seqT'), some;
  var FEITOS='.gap.cheio,.clipe.feito,.dit.certo,.esc.certo,.erro.feito,.ord.certo,.par.feito';
  var FRASES={5:'Keep going.',10:'On fire.',15:'Unstoppable.',20:'Legend.'};
  function mostra(pulo){
    clearTimeout(some);
    if(c<2){ el.classList.remove('ve','marco'); return; }
    var marco=c%5===0;
    n.textContent=c; t.innerHTML='in a row'+(marco&&FRASES[c]?' <small>'+FRASES[c]+'</small>':(marco?' <small>Keep going.</small>':''));
    el.classList.add('ve'); el.classList.toggle('marco',marco);
    if(pulo){ el.classList.remove('pula'); void el.offsetWidth; el.classList.add('pula'); }
    try{ if(marco&&navigator.vibrate) navigator.vibrate([10,40,10]); }catch(e){}
    some=setTimeout(function(){ el.classList.remove('ve'); }, marco?3200:2200);
  }
  var origFim=confereFim, origErro=marcaErro;
  marcaErro=function(item){ if(c>0){ c=0; el.classList.remove('ve','marco'); } return origErro.apply(this,arguments); };
  confereFim=function(){
    var novos=0;
    document.querySelectorAll(FEITOS).forEach(function(x){ if(contados.indexOf(x)>=0) return; contados.push(x); if(!x.getAttribute('data-errou')) novos++; });
    if(novos){ c+=novos; try{ S.seq=Math.max(S.seq||0,c); }catch(e){} mostra(true); }
    return origFim.apply(this,arguments);
  };
  /* o recorde da lição entra no aviso de fim de rodada */
  if(typeof fechouRodada==='function'){
    var origRodada=fechouRodada;
    fechouRodada=function(){
      var r=origRodada.apply(this,arguments);
      try{ var best=S.seq||0, sm=document.querySelector('#toast small'); if(best>=3&&sm) sm.textContent+=' · best streak '+best; }catch(e){}
      return r;
    };
  }
})();
</script>
